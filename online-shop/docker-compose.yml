services:
    webapi:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        container_name: test_api
        depends_on:
            - db
    db:
        image: postgres:latest
        ports: 
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 4160
        volumes:
            - db_data:/var/lib/postgresql/data
        container_name: db_test
volumes:
    db_data: